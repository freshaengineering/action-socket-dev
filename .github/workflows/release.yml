name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [dist/**]

permissions:
  contents: read # for checkout

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
    steps:
      # setup github auth with bot
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          use-policy-store: true
          api-key: ${{ secrets.GH_FRESHAENGINEERING_STEP_SECURITY_API_KEY }}

      - name: github auth
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.1.4
        with:
          app-id: ${{ secrets.GH_BOT_APP_ID }}
          private-key: ${{ secrets.GH_BOT_APP_PEM_FILE }}

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup mise
        uses: step-security/mise-action@6e96d2ffbc65c037f23c78818f2a339d6cf830f7 # v4.2.4
        with:
          version: '2026.8.12'

      - name: install deps
        run: npm ci --ignore-scripts

      - name: release
        env:
          GIT_AUTHOR_NAME: socket-release-bot[bot]
          GIT_AUTHOR_EMAIL: 234652667+socket-release-bot[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: socket-release-bot[bot]
          GIT_COMMITTER_EMAIL: 234652667+socket-release-bot[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ steps.bot.outputs.token }}
        run: npx semantic-release
